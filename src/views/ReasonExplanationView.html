<section class="reason-section">
  <button type="button" class="btn-reason-toggle" data-ref="toggleButton">今日はどんな日？</button>
  <div class="reason-card" data-ref="cardContainer" hidden>
    <p class="reason-loading" data-ref="loadingMessage" hidden>周囲の天気を調べています</p>
    <div class="reason-body-wrapper" data-ref="resultContainer" hidden>
      <div class="reason-header">
        <span class="reason-icon" data-ref="reasonIcon"></span>
        <h2 class="reason-title" data-ref="reasonTitle"></h2>
      </div>
      <p class="reason-body" data-ref="reasonDetail"></p>
      <div class="reason-meta">
        <span class="reason-credit">気象庁防災情報XMLを加工して作成（編集責任： ShinH）</span>
      </div>
    </div>
  </div>
</section>
